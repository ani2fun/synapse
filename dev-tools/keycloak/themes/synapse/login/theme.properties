# Synapse-aligned login theme — layers branding over keycloak.v2 (PatternFly v5).
# `styles` re-lists the parent's styles.css (resource inheritance finds it in keycloak.v2) and
# appends ours, so the base layout loads and synapse.css overrides it. The PatternFly vendor CSS
# rides in via the inherited `stylesCommon`, untouched.
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/synapse.css
